services:
  db:
    image: postgres:16-alpine
    container_name: digivaluer_sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-digivaluer_sentinel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sentinel} -d $${POSTGRES_DB:-digivaluer_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: digivaluer_sentinel_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digivaluer_sentinel_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_secret}@db:5432/${POSTGRES_DB:-digivaluer_sentinel}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DIGIVALUER_WEBHOOK_SECRET=${DIGIVALUER_WEBHOOK_SECRET:-your_webhook_signing_secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HUMAN_IN_THE_LOOP=${HUMAN_IN_THE_LOOP:-true}
      - APP_PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ./app:/app/app
      - ./frontend/dist:/app/frontend/dist:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digivaluer_sentinel_worker
    restart: unless-stopped
    command: python -m app.worker --loop
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_secret}@db:5432/${POSTGRES_DB:-digivaluer_sentinel}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DIGIVALUER_WEBHOOK_SECRET=${DIGIVALUER_WEBHOOK_SECRET:-your_webhook_signing_secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HUMAN_IN_THE_LOOP=${HUMAN_IN_THE_LOOP:-true}
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digivaluer_sentinel_frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://api:8001
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
